# Checks for the static site (apps/web) and the Netlify Functions (apps/api/functions).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Local links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --offline: only local files and #anchors are checked, so no network flakiness.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress 'apps/web/**/*.html'
          fail: true

  checks:
    name: JS syntax, HTML validity, functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # matches NODE_VERSION in netlify.toml
          cache: npm
      - run: npm ci
      - name: node --check every JS file
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n1 -t node --check
      - name: html-validate (standard preset)
        run: npx --yes html-validate@11 --preset=standard $(git ls-files 'apps/web/*.html')
      # Importing must succeed and yield a default-export handler; nothing is invoked,
      # so no API key or Netlify Blobs store is needed.
      - name: Import Netlify Functions
        run: |
          node --input-type=module -e '
            for (const f of ["leads", "counsellor"]) {
              const m = await import(`./apps/api/functions/${f}.mjs`);
              if (typeof m.default !== "function") throw new Error(`${f}.mjs: no default-export handler`);
              console.log(`${f}.mjs: default export ok`);
            }'
