# Netlify deploy config for PathAhead (static site + Netlify Functions)
# The site itself has no build step; only the functions get their deps installed.
#
# Layout:
#   apps/web/            everything the site serves (published as the site root,
#                        so /about.html, /sw.js, /roadmaps/*.pdf keep their URLs)
#   apps/api/functions/  Netlify Functions, served at /.netlify/functions/*
#   package.json         at the repo root (the base directory), so Netlify's
#                        `npm install` runs there and the bundler resolves the
#                        functions' dependencies from ./node_modules
[build]
  publish = "apps/web"

# Pinned so a change to Netlify's default Node cannot break the function.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "apps/api/functions"
  node_bundler = "esbuild"

# Only apps/web is published now, so none of these paths exist in the deploy
# any more. The rules are kept as a belt-and-braces guard in case the publish
# directory is ever pointed back at the repo root (e.g. by a dashboard
# override). `force` is required: without it a real file on disk wins.
# Note this does not touch the functions, which are served from
# /.netlify/functions/* (leading dot) and are unaffected.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Serve a friendly 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Sensible security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
